    body {

    .reveal {
      opacity: 0;

    .reveal.active { opacity: 1; transform: translateY(0); }

      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      transition: opacity 0.2s ease, transform 0.2s ease;

      color: #86868b;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;

      transition: all 0.3s ease;
      cursor: pointer;

    .filter-btn.active { color: #1d1d1f; background-color: #e8e8ed; }

      line-height: 1.85;
      color: #1d1d1f;

    .article-content h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 3rem 0 1rem;
      letter-spacing: -0.02em;
    }
    .article-content h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
    }
    .article-content p { margin-bottom: 1.6rem; }
    .article-content strong { font-weight: 600; }
    .article-content a {
      color: #0066cc;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,102,204,0.3);
      transition: border-color 0.2s;
    }
    .article-content a:hover { border-color: #0066cc; }
    .article-content :not(pre) > code {
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.88em;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }
    .article-content pre {
      background: #1d1d1f;
      color: #f5f5f7;
      padding: 1.5rem 1.75rem;
      border-radius: 16px;
      overflow-x: auto;
      margin: 2rem 0;
      font-size: 14px;
      line-height: 1.7;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }
    .article-content pre code { background: transparent; padding: 0; font-size: inherit; color: inherit; }
    .article-content blockquote {
      border-left: 4px solid #d2d2d7;
      padding: 0.5rem 0 0.5rem 1.5rem;
      color: #86868b;
      font-style: italic;
      margin: 2rem 0;
    }
    .article-content ul, .article-content ol { margin: 1.2rem 0; padding-left: 1.5rem; }
    .article-content li { margin-bottom: 0.5rem; }
    .article-content ul li::marker { color: #86868b; }
    .article-content img { max-width: 100%; border-radius: 16px; margin: 2rem 0; }
    .article-content hr { border: none; border-top: 1px solid #e8e8ed; margin: 3rem 0; }

    .author-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #1d1d1f, #86868b);
      color: #fff; font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .page-cover {
      width: 100%; height: 35vh; overflow: hidden;
      background-size: cover; background-position: center center;
    }

    /* 首页卡片三种尺寸 */
    .card-lg  { min-height: 500px; }
    .card-md  { min-height: 380px; }
    .card-sm  { min-height: 260px; }
    #article-grid { grid-auto-flow: dense; }
    @media (min-width: 768px) {
      .card-lg { grid-column: span 2; }
    }
  </style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          obs.unobserve(entry.target);
        }
      });
    }, {
      root: null,
      rootMargin: '0px',
      threshold: 0.15
    });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  });
</script>

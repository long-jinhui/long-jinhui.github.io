  <!-- 暗色模式切换 -->
  <script>
  (function() {
    var html = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    var KEY = 'theme-preference';
    if (!toggle) return;

    toggle.addEventListener('click', function() {
      var isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem(KEY, 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem(KEY, 'dark');
      }
    });

    // 系统主题变化时跟随（仅当用户未曾手动设置时）
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem(KEY)) {
          if (e.matches) html.classList.add('dark');
          else html.classList.remove('dark');
        }
      });
    }
  })();
  </script>

<script>
  (function() {
    var threshold = 0.15;

    function isInViewport(el) {
      var rect = el.getBoundingClientRect();
      var windowHeight = window.innerHeight || document.documentElement.clientHeight;
      // 元素的 visible 高度
      var visibleHeight = Math.max(0, Math.min(rect.bottom, windowHeight) - Math.max(rect.top, 0));
      var elementHeight = rect.height || 1;
      return (visibleHeight / elementHeight) >= threshold;
    }

    function activate(el) {
      if (!el.classList.contains('active')) {
        el.classList.add('active');
      }
    }

    function init() {
      var revealEls = document.querySelectorAll('.reveal');
      if (!revealEls.length) return;

      // 1) 立即激活已在视口内的元素
      revealEls.forEach(function(el) {
        if (isInViewport(el)) {
          activate(el);
        }
      });

      // 2) 视口外的元素用 IntersectionObserver 监听
      var observer = new IntersectionObserver(function(entries, obs) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            activate(entry.target);
            obs.unobserve(entry.target);
          }
        });
      }, {
        root: null,
        rootMargin: '0px',
        threshold: threshold
      });

      revealEls.forEach(function(el) {
        if (!el.classList.contains('active')) {
          observer.observe(el);
        }
      });

      // 3) 安全兜底：2 秒后强制显示所有仍未激活的元素
      setTimeout(function() {
        document.querySelectorAll('.reveal:not(.active)').forEach(function(el) {
          el.classList.add('active');
        });
      }, 2000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
